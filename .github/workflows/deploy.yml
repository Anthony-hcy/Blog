name: Build & Deploy

on:
  push:
    branches: [main]
  # 采集 workflow（GITHUB_TOKEN 提交的 chore: update friend circle data）不会触发 push 事件，
  # 用 workflow_run 监听其完成事件来触发部署，保证定时任务采集的数据能自动上线
  workflow_run:
    workflows: ["Update Friend Circle Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 的 completed 事件无论成功失败都会触发，只在采集成功时才部署
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无 npm 依赖（marked 已 vendor 进 vendor/），无需 setup-node / npm ci
      # ffmpeg 只用于：①给实况视频转码 H.264 兼容版（仓库只提交 .avc.mp4，通常用不到）
      #             ②给缺 .thumb.jpg 的图片生成 480px 缩略图（兜底，正常也已随仓库提交）
      # 两种情况都没有的构建（普通增删改文章）就跳过安装，省 80MB 下载 + 十几秒。
      # 安装优先走静态包直连下载（~80MB，十几秒），apt 仅作备用（apt 很慢）。
      - name: Check ffmpeg needed
        id: check-ffmpeg
        run: |
          NEEDS=false
          # ① 存在非 avc 的原始 mp4（新实况图未转码就提交了）
          if find static/assets/img -type f -name '*.mp4' ! -name '*.avc.mp4' 2>/dev/null | grep -q .; then
            NEEDS=true
          fi
          # ② 存在缺 .thumb.jpg 的图片（图片新增/重传后未生成缩略图）
          if [ "$NEEDS" != "true" ]; then
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              thumb="${img%.*}.thumb.jpg"
              if [ ! -f "$thumb" ]; then NEEDS=true; break; fi
            done < <(find static/assets/img -type f \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) ! -name '*.thumb.jpg' 2>/dev/null)
          fi
          echo "needs_ffmpeg=$NEEDS" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.check-ffmpeg.outputs.needs_ffmpeg == 'true'
        run: |
          # 优先静态包直连下载：runner 网络偶发抖动（DNS/连接失败）时自动重试多轮。
          # 注意：第三方 CDN 有时会返回 200 + 一段 HTML 错误页，curl 视为成功，
          # 于是 tar 拿到垃圾数据直接失败（2026-10-11 真实发生过一次）。
          # 所以每轮都先用 xz -t 校验，内容不合法就丢掉重来；三轮都不行再退回 apt。
          rm -f /tmp/ff.tar.xz
          for i in 1 2 3; do
            curl -fsSL --connect-timeout 15 --retry 3 --retry-all-errors --retry-delay 2 \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ff.tar.xz || true
            if [ -s /tmp/ff.tar.xz ] && xz -t /tmp/ff.tar.xz 2>/dev/null; then
              echo "静态包校验通过（第 $i 轮）"
              break
            fi
            echo "第 $i 轮拿到的内容不可用，重试"
            rm -f /tmp/ff.tar.xz
            [ "$i" -lt 3 ] && sleep 3
          done
          if [ -s /tmp/ff.tar.xz ]; then
            sudo tar -xJf /tmp/ff.tar.xz -C /opt --strip-components=1
            sudo ln -sf /opt/ffmpeg /usr/local/bin/ffmpeg
            sudo ln -sf /opt/ffprobe /usr/local/bin/ffprobe
          else
            # 备用：apt（先 update 再装，顺序不能反）
            sudo apt-get update -qq || { sleep 3; sudo apt-get update -qq; }
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - run: node scripts/build.mjs
      # configure-pages 已省略：Pages 站点早已配置好（build_type=workflow），省 ~1s
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

      # ============================================================
      # 国内直连（haelcy.cn）：同一份源码、同一个 commit 再构建一次「根路径版」做自检。
      # 两站的页面内容始终一致，唯一差别是 URL 前缀（Pages 是 /Blog，自有域名是 /）
      # 与 canonical 域名。
      #
      # 站点上线采用「服务器主动拉取」模型 —— 这里不再往服务器推任何东西：
      #   服务器上 haelcy-pull.timer 每 5 分钟查一次本仓库 main 的最新提交，
      #   有变化就用 codeload 下载源码包，用同一份 scripts/build.mjs 本地构建
      #   （SITE_URL=https://haelcy.cn SITE_BASE=__root__），再原子替换站点目录。
      #
      # 好处：
      #   1. GitHub 侧不再需要 SSH 登录服务器 —— 阿里云的「异地登录」告警从根上消失，
      #      而且仓库里不必再保存一把能 root 登录服务器的私钥。
      #   2. 服务器短暂离线也不会丢部署：下一轮拉取会自己补上。
      # 代价：站点更新有最多 5 分钟延迟（博客场景无所谓）。
      #
      # 服务器侧入口：/opt/haelcy-blog/deploy.sh ｜ 日志：/var/log/haelcy-pull.log
      # （以前用过的 ALIYUN_HOST / ALIYUN_SSH_KEY 两个 Secret 已不再需要，可删除）
      # ============================================================
      - name: Build for haelcy.cn (root path)
        env:
          SITE_URL: https://haelcy.cn
          SITE_BASE: __root__
        run: node scripts/build.mjs

      - name: Self-check built assets
        run: node deploy/check-assets.mjs
