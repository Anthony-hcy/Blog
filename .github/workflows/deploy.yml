name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无 npm 依赖（marked 已 vendor 进 vendor/），无需 setup-node / npm ci
      - run: node scripts/build.mjs
      # configure-pages 已省略：Pages 站点早已配置好（build_type=workflow），省 ~1s
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
