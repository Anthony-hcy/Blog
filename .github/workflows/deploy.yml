name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无 npm 依赖（marked 已 vendor 进 vendor/），无需 setup-node / npm ci
      # ffmpeg 只用于给实况视频转码 H.264 兼容版（桌面浏览器播 HEVC 需要）。
      # 没有实况视频的构建（普通增删改文章/图片）就跳过安装。
      # 安装优先走静态包直连下载（~80MB，十几秒），apt 仅作备用（apt 很慢）。
      - name: Check ffmpeg needed
        id: check-ffmpeg
        run: |
          NEEDS=false
          if find static/assets/img -type f -name '*.mp4' ! -name '*.avc.mp4' 2>/dev/null | grep -q .; then
            NEEDS=true
          fi
          echo "needs_ffmpeg=$NEEDS" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: steps.check-ffmpeg.outputs.needs_ffmpeg == 'true'
        run: |
          # 优先静态包直连下载：runner 网络偶发抖动（DNS/连接失败）时自动重试多轮
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 15 --retry 3 --retry-all-errors --retry-delay 2 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz; then
              break
            fi
            [ "$i" -lt 3 ] && sleep 3
          done
          if [ -s /tmp/ff.tar.xz ]; then
            sudo tar -xJf /tmp/ff.tar.xz -C /opt --strip-components=1
            sudo ln -sf /opt/ffmpeg /usr/local/bin/ffmpeg
            sudo ln -sf /opt/ffprobe /usr/local/bin/ffprobe
          else
            # 备用：apt（update 也带一次重试）
            sudo apt-get install -y -qq ffmpeg || {
              sudo apt-get update -qq || { sleep 3; sudo apt-get update -qq; }
              sudo apt-get install -y -qq ffmpeg
            }
          fi
          ffmpeg -version | head -1
      - run: node scripts/build.mjs
      # configure-pages 已省略：Pages 站点早已配置好（build_type=workflow），省 ~1s
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
