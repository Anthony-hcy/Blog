# 朋友圈数据采集（FriendCircle 极简模式）
# 每天北京时间 04:00（UTC 20:00）跑一次：下载官方 fcircle_core 二进制，采集友链 RSS，生成 data.json 提交回仓库，
# 触发 deploy.yml 构建部署，前端 /fcircle/ 页面读取 site-root/fcircle-data.json。
name: Update Friend Circle Data

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fcircle-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download fcircle_core binary
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/Rock-Candy-Tea/hexo-circle-of-friends/releases/download/v6.0.6/linux-x86_64-unknown-linux-musl.zip" \
            -o fc.zip
          unzip -o fc.zip
          chmod +x fcircle_core

      - name: Run collector (simple mode)
        run: ./fcircle_core
        env:
          TZ: Asia/Shanghai

      - name: Publish data.json into site-root
        run: |
          mkdir -p site-root
          cp data.json site-root/fcircle-data.json

      - name: Commit updated data
        uses: EndBug/add-and-commit@v9
        with:
          add: "site-root/fcircle-data.json"
          message: "chore: update friend circle data"
          default_author: github_actions
          push: true
