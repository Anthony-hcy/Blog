# 观影记录数据采集
# 每月 12 号、27 号北京时间 04:00（UTC 前一天 20:00）抓取一次 Workspace 仓库的 theatre.json，
# 精简后提交 content/theatre.json，触发部署。
name: Update Theatre Data

on:
  schedule:
    # 北京时间 12 日 / 27 日 04:00 = UTC 11 日 / 26 日 20:00
    - cron: "0 20 11,26 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theatre-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch theatre data
        run: node scripts/fetch-theatre.mjs

      - name: Commit updated data
        uses: EndBug/add-and-commit@v9
        with:
          add: "content/theatre.json"
          message: "chore: update theatre data"
          default_author: github_actions
          push: true
          # 采集期间若主仓有新提交，先 rebase 再推，避免数据提交丢失。
          pull: '--rebase --autostash'
