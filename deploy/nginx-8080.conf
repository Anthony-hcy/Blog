# haelcy.cn 备案前的验证站
#
#   用途：备案审核期间先在这台机器的 8080 端口验证 nginx 与站点产物，
#         不占用 80/443，也不需要备案就能访问。
#   访问：http://120.24.234.170:8080/
#   部署：cp 本文件到 /etc/nginx/conf.d/haelcy-8080.conf && nginx -t && systemctl reload nginx
#   备案通过后：改用 nginx-blog.conf，并删掉本文件。
#
# 缓存策略说明：
#   构建脚本给 JS/CSS/图片的 URL 都带内容哈希查询串（?v=xxxx），内容一变 URL 就变，
#   所以 /assets/ 可以放心用一年强缓存；反过来 sw.js、version.json、HTML 必须每次回源，
#   否则 PWA 会一直用旧的 Service Worker、页面内容也不刷新。

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/blog/dist;
    index index.html;
    charset utf-8;

    # 目录式 URL：/archives/xxx/ → /archives/xxx/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    # 目录存在但没有 index.html（如 /category/、/tag/、/page/）时 nginx 默认回 403，
    # 这里强制成 404 并套用 404 页，与 GitHub Pages 的行为保持一致
    error_page 403 =404 /404.html;

    # 带内容哈希的资源：长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker 与构建版本指纹：必须每次回源
    location = /sw.js        { expires -1; add_header Cache-Control "no-cache"; }
    location = /version.json { expires -1; add_header Cache-Control "no-cache"; }

    # 朋友圈数据由 GitHub Actions 每天采集 4 次，要能及时刷新
    location = /fcircle-data.json   { expires -1; add_header Cache-Control "no-cache"; }
    location = /fcircle-errors.json { expires -1; add_header Cache-Control "no-cache"; }

    # 实况视频：支持 Range 播放，不做压缩
    location ~* \.(mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;
}
