# haelcy.cn 正式站点（ICP 备案通过后再启用）
#
#   部署：cp 本文件到 /etc/nginx/conf.d/haelcy.conf
#         rm -f /etc/nginx/conf.d/haelcy-8080.conf
#         nginx -t && systemctl reload nginx
#   HTTPS：apt-get install -y certbot python3-certbot-nginx
#          certbot --nginx -d haelcy.cn -d www.haelcy.cn --redirect
#          （certbot 会自动补出 443 server 块，并把 80 改成跳转到 443；证书自动续期）
#
#   前置条件（缺一不可）：
#     1. 域名已备案通过，且 DNS 的 A 记录已指向本机公网 IP；
#     2. 轻量应用服务器防火墙放行 80 与 443。
#
# 缓存策略说明：见 nginx-8080.conf 顶部注释（资源带内容哈希可长缓存，SW/版本/HTML 必须回源）。

server {
    listen 80;
    listen [::]:80;
    server_name haelcy.cn www.haelcy.cn;

    root /var/www/blog/dist;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    # 目录存在但没有 index.html（如 /category/、/tag/、/page/）时 nginx 默认回 403，
    # 这里强制成 404 并套用 404 页，与 GitHub Pages 的行为保持一致
    error_page 403 =404 /404.html;

    # 带内容哈希的资源：长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker 与构建版本指纹：必须每次回源，否则 PWA 更新会卡住
    location = /sw.js        { expires -1; add_header Cache-Control "no-cache"; }
    location = /version.json { expires -1; add_header Cache-Control "no-cache"; }

    # 朋友圈数据由 GitHub Actions 每天采集 4 次，要能及时刷新
    location = /fcircle-data.json   { expires -1; add_header Cache-Control "no-cache"; }
    location = /fcircle-errors.json { expires -1; add_header Cache-Control "no-cache"; }

    # 实况视频：支持 Range 播放，不做压缩
    location ~* \.(mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;
}
