BLOCK_SITE: [
]

BLOCK_SITE_REVERSE: false

# 每个友链最多收录几篇文章。
# 注意：FriendCircle 按 feed 条目顺序截取前 N 条，有些博客的 feed 是时间正序（旧在前），
# N 太小会只取到旧文章；取 20 保证最新文章进得来。
MAX_POSTS_NUM: 20

# 文章清理：0 = 不清理（文章只增不减，靠前端分页渲染缓解加载压力）
OUTDATE_CLEAN: 0

# FriendCircle 自身常驻调度用；本项目由 GitHub Actions schedule 触发（fcircle-data.yml），此处不生效
CRON: "0 20 * * *"

# 极简模式：只产出 data.json（部署到 GitHub Pages 供前端读取）
SIMPLE_MODE: true

DATABASE: "sqlite"

# AI 摘要（未启用）
GENERATE_SUMMARY: {
    enabled: false,
    provider: "all",
    max_concurrent: 3,
    wait_on_rate_limit: true,
    max_chars: 8000,
    gemini: { models: [] },
    siliconflow: { models: [] },
    bigmodel: { models: [] },
}
