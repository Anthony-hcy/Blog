# ===== 朋友圈采集配置（FriendCircle）=====
# 数据源模式：手动友链清单（SETTINGS_FRIENDS_LINKS）——把要收录的友链博客主页 URL 逐个加进 list
# 每个友链必须有 RSS（或匹配 css_rules.yaml 的 HTML 规则）才能抓到文章；
# 无 RSS 的会出现在"失联"统计里（error_num）。
DEPLOY_TYPE: "github"

# 友链页爬取（本方案不用，保持空）
LINK: []

# 手动友链清单：
#   ["名字", "主页URL", "头像URL", "可选订阅后缀"]
#   订阅后缀：默认自动探测 atom.xml / feed/atom / rss.xml / rss2.xml / feed / index.xml；
#   特殊后缀（如 hello.xml）才需要第 4 项
SETTINGS_FRIENDS_LINKS: {
    enable: true,
    json_api_or_path: "",
    list: [
        # 测试：regenm（无 RSS，靠 HTML 规则兜底抓取成功）
        ["regenm", "https://regenm.github.io/", "https://regenm.github.io/images/touxiang.jpg"],
        # 测试：失眠海峡（有 Atom feed：/feed/atom/）
        ["失眠海峡", "https://blog.imalan.cn/", "https://blog.imalan.cn/logo.jpg"],
    ]
}

BLOCK_SITE: [
]

BLOCK_SITE_REVERSE: false

# 每个友链最多收录几篇文章。
# 注意：FriendCircle 按 feed 条目顺序截取前 N 条，有些博客的 feed 是时间正序（旧在前），
# N 太小会只取到旧文章；取 20 保证最新文章进得来。
MAX_POSTS_NUM: 20

# 文章清理：0 = 不清理（文章只增不减，靠前端分页渲染缓解加载压力）
OUTDATE_CLEAN: 0

CRON: "0 0,6,12,18,21 * * *"

# 极简模式：只产出 data.json（部署到 GitHub Pages 供前端读取）
SIMPLE_MODE: true

DATABASE: "sqlite"

# AI 摘要（未启用）
GENERATE_SUMMARY: {
    enabled: false,
    provider: "all",
    max_concurrent: 3,
    wait_on_rate_limit: true,
    max_chars: 8000,
    gemini: { models: [] },
    siliconflow: { models: [] },
    bigmodel: { models: [] },
}
