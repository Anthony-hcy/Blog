# ===== 朋友圈采集配置（FriendCircle）=====
# 数据源模式：手动友链清单（SETTINGS_FRIENDS_LINKS）——把要收录的友链博客主页 URL 逐个加进 list
# 每个友链必须有 RSS（或匹配 css_rules.yaml 的 HTML 规则）才能抓到文章；
# 无 RSS 的会出现在"失联"统计里（error_num）。
DEPLOY_TYPE: "github"

# 友链页爬取（本方案不用，保持空）
LINK: []

# 手动友链清单：
#   ["名字", "主页URL", "头像URL", "可选订阅后缀"]
#   订阅后缀：默认自动探测 atom.xml / feed/atom / rss.xml / rss2.xml / feed / index.xml；
#   特殊后缀（如 hello.xml）才需要第 4 项
SETTINGS_FRIENDS_LINKS: {
    enable: true,
    json_api_or_path: "",
    list: [
        # 测试：regenm（无 RSS 且首页结构不匹配内置规则，预期抓不到文章，用于演示"失联"）
        ["regenm", "https://regenm.github.io/", "https://regenm.github.io/images/touxiang.jpg"],
    ]
}

BLOCK_SITE: [
]

BLOCK_SITE_REVERSE: false

# 每个友链最多收录几篇文章
MAX_POSTS_NUM: 5

# 距今超过 90 天的文章在下次运行时自动清理（0 = 不清理，文章只增不减）
OUTDATE_CLEAN: 90

CRON: "0 0,6,12,18,21 * * *"

# 极简模式：只产出 data.json（部署到 GitHub Pages 供前端读取）
SIMPLE_MODE: true

DATABASE: "sqlite"

# AI 摘要（未启用）
GENERATE_SUMMARY: {
    enabled: false,
    provider: "all",
    max_concurrent: 3,
    wait_on_rate_limit: true,
    max_chars: 8000,
    gemini: { models: [] },
    siliconflow: { models: [] },
    bigmodel: { models: [] },
}
