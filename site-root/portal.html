<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Blog Portal</title>
  <link rel="stylesheet" href="/assets/main.css">
  <link rel="stylesheet" href="/assets/portal.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600&display=swap">
  <link rel="stylesheet" href="/assets/fontawesome/all.min.css">
</head>
<body class="portal-body" data-api-base="">
  <div class="portal-shell">
    <header class="portal-header">
      <h1 class="portal-title">Blog Portal</h1>
      <div class="portal-header-actions">
        <span class="portal-account" id="portal-account" hidden></span>
        <button class="portal-btn portal-btn-ghost" id="portal-signout" type="button" hidden>Sign Out</button>
      </div>
    </header>

    <nav class="portal-tabs" id="portal-tabs" hidden>
      <button class="portal-tab is-active" data-tab="posts" type="button">Posts</button>
      <button class="portal-tab" data-tab="edit" type="button">Edit</button>
      <button class="portal-tab" data-tab="images" type="button">Images</button>
      <button class="portal-tab" data-tab="status" type="button">Status</button>
    </nav>

    <main class="portal-main">
      <!-- 登录区 -->
      <section class="portal-view is-active" id="view-login">
        <div class="portal-card">
          <h2 class="portal-card-title">Sign in</h2>
          <p class="portal-hint">使用 GitHub Personal Access Token 登录（需要 repo 读写权限），用于在仓库中读写文章与图片。</p>
          <label class="portal-field">
            <span>Owner / Repo</span>
            <input type="text" id="portal-repo" placeholder="username/repository" autocomplete="off">
          </label>
          <label class="portal-field">
            <span>Personal Access Token</span>
            <input type="password" id="portal-token" placeholder="ghp_..." autocomplete="off">
          </label>
          <label class="portal-field">
            <span>你的名字（署名）</span>
            <input type="text" id="portal-author" placeholder="我的名字">
          </label>
          <button class="portal-btn portal-btn-primary" id="portal-signin" type="button">Sign in</button>
        </div>
      </section>

      <!-- Posts 列表 -->
      <section class="portal-view" id="view-posts" hidden>
        <div class="portal-toolbar">
          <button class="portal-btn portal-btn-primary" id="btn-new-post" type="button">+ New post</button>
          <span class="portal-hint" id="posts-count"></span>
        </div>
        <div class="portal-list" id="posts-list"></div>
      </section>

      <!-- Edit 编辑器 -->
      <section class="portal-view" id="view-edit" hidden>
        <div class="portal-card">
          <div class="portal-grid">
            <label class="portal-field">
              <span>Title</span>
              <input type="text" id="edit-title" placeholder="文章标题">
            </label>
            <label class="portal-field">
              <span>Slug</span>
              <input type="text" id="edit-slug" placeholder="url-slug">
            </label>
          </div>
          <div class="portal-grid">
            <label class="portal-field">
              <span>Date</span>
              <input type="datetime-local" id="edit-date">
            </label>
            <label class="portal-field">
              <span>Type</span>
              <select id="edit-type">
                <option value="post">post</option>
                <option value="memo">memo</option>
              </select>
            </label>
          </div>
          <div class="portal-grid">
            <label class="portal-field">
              <span>Category</span>
              <input type="text" id="edit-category" placeholder="分类">
            </label>
            <label class="portal-field">
              <span>Tags (逗号分隔)</span>
              <input type="text" id="edit-tags" placeholder="tag1, tag2">
            </label>
          </div>
          <label class="portal-field">
            <span>Excerpt（可选）</span>
            <input type="text" id="edit-excerpt" placeholder="摘要">
          </label>
          <label class="portal-field">
            <span>Banner（可选，/assets/img/... 路径）</span>
            <input type="text" id="edit-banner" placeholder="/assets/img/post/cover.png">
          </label>
          <label class="portal-field">
            <span>Content (Markdown)</span>
            <textarea id="edit-body" rows="16" placeholder="支持 Markdown，图片会以 figure 形式渲染"></textarea>
          </label>
          <div class="portal-actions">
            <button class="portal-btn portal-btn-ghost" id="btn-cancel-edit" type="button">Cancel</button>
            <button class="portal-btn portal-btn-primary" id="btn-save-post" type="button">Save &amp; Publish</button>
          </div>
        </div>
      </section>

      <!-- Images 图片管理 -->
      <section class="portal-view" id="view-images" hidden>
        <div class="portal-card">
          <div class="portal-grid">
            <label class="portal-field">
              <span>Post slug（图片存放目录）</span>
              <input type="text" id="img-slug" placeholder="post-slug">
            </label>
            <div class="portal-field">
              <span>&nbsp;</span>
              <input type="file" id="img-file" multiple accept="image/*">
            </div>
          </div>
          <button class="portal-btn portal-btn-primary" id="btn-upload" type="button">Upload</button>
          <div class="portal-progress" id="img-progress" hidden></div>
        </div>
        <div class="portal-card">
          <h2 class="portal-card-title">Images in <code id="img-dir-label">content/..</code></h2>
          <div class="portal-grid images-grid" id="images-grid"></div>
        </div>
      </section>

      <!-- Status 状态 -->
      <section class="portal-view" id="view-status" hidden>
        <div class="portal-card">
          <h2 class="portal-card-title">Build</h2>
          <div class="portal-stat-row">
            <span class="portal-stat-label">Status</span>
            <span class="portal-stat-value" id="status-build">-</span>
          </div>
          <div class="portal-actions">
            <button class="portal-btn portal-btn-primary" id="btn-rebuild" type="button">Rebuild Site</button>
          </div>
        </div>
        <div class="portal-card">
          <h2 class="portal-card-title">Site Content</h2>
          <div class="portal-stat-row">
            <span class="portal-stat-label">Latest commit</span>
            <span class="portal-stat-value portal-commit" id="status-commit">-</span>
          </div>
          <div class="portal-actions">
            <button class="portal-btn portal-btn-ghost" id="btn-commit" type="button">Commit Changes</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="portal-toast" id="portal-toast" hidden></div>
  <script src="/assets/portal.js"></script>
</body>
</html>
